[project]
name = "sumika-harbor"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = ["harbor==0.24.0", "pydantic>=2.14.1,<3"]

[dependency-groups]
dev = ["mypy>=1.19", "ruff>=0.17.2"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
extend-exclude = ["tasks"]

[tool.ruff.per-file-target-version]
"worker.py" = "py37"
# The standalone Linux worker checks also import the bridge in the fixture image.
"bridge.py" = "py313"
"test_bridge.py" = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["script/harbor/models.py"]
strict = true
cache_dir = ".build/harbor-mypy"
