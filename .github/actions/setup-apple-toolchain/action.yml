name: Setup Apple toolchain
description: Select and verify the repository's Apple toolchain, including the Metal compiler.

outputs:
  cache-key:
    description: Stable toolchain fingerprint for dependency cache keys.
    value: ${{ steps.setup.outputs.cache-key }}

runs:
  using: composite
  steps:
    - name: Select and verify Apple toolchain
      id: setup
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/setup.sh"

    - name: Ensure Metal toolchain is available
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/ensure-metal.sh"
