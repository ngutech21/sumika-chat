name: Apple toolchain configuration

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref used by the consuming job; empty uses the triggering commit.
        required: false
        type: string
        default: ""
    outputs:
      runner:
        description: GitHub-hosted macOS runner for the selected Apple toolchain.
        value: ${{ jobs.configuration.outputs.runner }}

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.configuration.outputs.runner }}
    steps:
      - name: Read macOS runner
        id: configuration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURATION_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          configuration="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/contents/.github/actions/setup-apple-toolchain/versions.env" \
            -f ref="$CONFIGURATION_REF" \
            -H 'Accept: application/vnd.github.raw+json')"
          runner="$(printf '%s\n' "$configuration" | awk '
            /^MACOS_RUNNER=/ { count++; sub(/^MACOS_RUNNER=/, ""); runner = $0 }
            END { if (count != 1) exit 1; print runner }
          ')" || {
            printf 'Expected exactly one MACOS_RUNNER assignment.\n' >&2
            exit 1
          }
          # Keep runner selection in versions.env; allow only reviewed hosted labels here.
          case "$runner" in
            xcode-27) ;;
            *)
              printf 'Unsupported MACOS_RUNNER.\n' >&2
              exit 1
              ;;
          esac
          printf 'runner=%s\n' "$runner" >> "$GITHUB_OUTPUT"
