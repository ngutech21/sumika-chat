name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static analysis
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select and verify Apple toolchain
        id: apple-toolchain
        uses: ./.github/actions/setup-apple-toolchain

      - name: Install just
        timeout-minutes: 10
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Cache SwiftLint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/swiftlint
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-toolchain.outputs.cache-key }}-swiftlint-${{ hashFiles('script/swiftlint/Package.resolved') }}

      - name: Prepare SwiftLint
        timeout-minutes: 10
        run: just prepare-swiftlint

      - name: Run format
        timeout-minutes: 10
        run: just format

      - name: Run SwiftLint
        timeout-minutes: 10
        run: just lint


  unit-tests:
    name: macOS Core, App, and MLX unit tests
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CLONED_SOURCE_PACKAGES_DIR_PATH: .build/xcode-source-packages
      # Hosted runners cannot approve mlx-swift package plugins or macros interactively.
      SKIP_PACKAGE_PLUGIN_VALIDATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select and verify Apple toolchain
        id: apple-toolchain
        uses: ./.github/actions/setup-apple-toolchain

      - name: Install just
        timeout-minutes: 10
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/xcode-source-packages
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-toolchain.outputs.cache-key }}-swiftpm-${{ hashFiles('Package.resolved', 'Sumika.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Verify Swift package lockfiles
        timeout-minutes: 10
        run: just check-package-locks

      - name: Run unit tests
        timeout-minutes: 30
        run: just test
